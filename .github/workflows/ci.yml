name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # El proyecto corre sobre PostgreSQL desde el 2026-09-15. La suite ya no
    # crea un archivo SQLite en el temporal: crea y destruye una base
    # `erp_test_<azar>` por corrida, así que CI necesita un servidor de verdad.
    # Ver docs/postgresql.md.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Sin esto los pasos arrancan antes de que el motor acepte conexiones y
        # el fallo parece de la suite, no del servicio.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Plantilla de conexión: de acá salen máquina, puerto y credenciales. El
      # nombre `erp_ci` lo usa el build; `npm test` lo reemplaza por el suyo.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El respaldo usa `pg_dump`/`pg_restore`, y una versión de cliente menor
      # que la del servidor se niega a volcar («server version mismatch»). El
      # runner trae el cliente 16 y el servicio de arriba es 17, así que hace
      # falta el repositorio oficial. `--version` al final: si esto falla, que
      # el error diga «faltan las herramientas» y no «falló el respaldo».
      - name: PostgreSQL client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          pg_restore --version

      - name: Create the build database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE erp_ci'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: |
          npx prisma format --check
          npx prisma validate

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Critical flows
        run: npm test

      - name: Build
        run: npm run build
